# CI safety net: every push re-checks types (web + all workers) and runs the
# unit/integration tests. A red X here = do not deploy.
#
# THE NODE VERSION IS NOT A DETAIL, AND IT IS NOT TYPED HERE TWICE BY ACCIDENT.
# It must equal `.nvmrc` and package.json's `engines.node`, and
# web/test/node-version-agrees.test.ts fails the build when the three disagree.
# Earned on 8 Sep 2026: a test began importing `node:sqlite`, a built-in that
# exists on Node 24 and not on 22. Every developer machine was on 24, the repo
# declared 22, and CI honoured the declaration — so the gate everyone ran and
# the gate CI ran were testing different things. Four commits went red here
# while `npm run check` stayed green on three laptops, and the only signal was
# an email nobody could read.
name: CI
on:
  push:
    branches: [main]
  pull_request:
# Least privilege for GITHUB_TOKEN. Without this the job inherits the repository
# default, which on many repos is write on `contents` — and `npm ci` below runs
# the install lifecycle scripts of ~380 dependencies inside that job. One
# compromised transitive package would be able to read the token out of the
# runner and push. This workflow only ever reads the code.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
